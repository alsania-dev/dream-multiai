<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Multi-AI - Character Generator & Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --bg-input: #0f0f1a;
            --bg-hover: #1e2a4a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b8a;
            --accent: #6c63ff;
            --accent-hover: #7b72ff;
            --accent-glow: rgba(108, 99, 255, 0.3);
            --border-color: #2a2a4a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --user-msg-bg: #2a2a4a;
            --ai-msg-bg: #16213e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        .app { max-width: 1100px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            font-size: 28px;
            color: var(--accent);
            background: rgba(108, 99, 255, 0.15);
            padding: 8px 12px;
            border-radius: 10px;
        }
        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c63ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span { font-size: 13px; color: var(--text-secondary); display: block; -webkit-text-fill-color: var(--text-secondary); }
        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn {
            padding: 8px 18px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { border-color: var(--accent); color: var(--text-primary); background: var(--bg-hover); }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
        .btn-danger { border-color: #ef4444; color: #ef4444; }
        .btn-danger:hover { background: #ef4444; color: #fff; }
        .btn-success { border-color: #22c55e; color: #22c55e; }
        .btn-success:hover { background: #22c55e; color: #fff; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .badge {
            background: rgba(108, 99, 255, 0.12);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--accent);
            border: 1px solid rgba(108, 99, 255, 0.2);
        }
        .main-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
        .sidebar {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 16px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .character-list { display: flex; flex-direction: column; gap: 6px; }
        .character-item {
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .character-item:hover { border-color: var(--accent); background: var(--bg-hover); }
        .character-item.active { border-color: var(--accent); background: rgba(108, 99, 255, 0.1); }
        .character-item .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--text-muted);
        }
        .character-item .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .character-item .info { flex: 1; min-width: 0; }
        .character-item .name { font-size: 14px; font-weight: 500; }
        .character-item .sub { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .character-item .actions { display: flex; gap: 4px; flex-shrink: 0; }
        .character-item .actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; }
        .character-item .actions button:hover { color: var(--text-primary); }
        .chat-area {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 70vh;
        }
        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header .left { display: flex; align-items: center; gap: 12px; }
        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-muted);
        }
        .chat-header .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-header .char-name { font-size: 18px; font-weight: 600; }
        .chat-header .char-status { font-size: 12px; color: var(--text-muted); }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            line-height: 1.6;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; background: var(--user-msg-bg); border-bottom-right-radius: 4px; }
        .message.ai { align-self: flex-start; background: var(--ai-msg-bg); border-bottom-left-radius: 4px; }
        .message .sender { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
        .message .content { word-wrap: break-word; }
        .chat-input {
            padding: 12px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .chat-input input:focus { border-color: var(--accent); }
        .chat-input input::placeholder { color: var(--text-muted); }
        .chat-input input:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-input button { padding: 10px 20px; }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }
        .empty-state i { font-size: 48px; opacity: 0.3; margin-bottom: 16px; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        .modal h2 { font-size: 20px; margin-bottom: 16px; }
        .modal label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
        .modal input, .modal textarea, .modal select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 12px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
        .modal textarea { min-height: 60px; resize: vertical; }
        .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
        .modal .avatar-preview {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .modal .avatar-preview .preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--text-muted);
        }
        .modal .avatar-preview .preview img { width: 100%; height: 100%; object-fit: cover; }
        .modal .avatar-preview .gen-btn { flex: 1; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            font-size: 14px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: #ef4444; }
        .toast.success { border-color: #22c55e; }
        .toast.warning { border-color: #f59e0b; }
        .api-status {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .api-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .api-status .dot.online { background: #22c55e; }
        .api-status .dot.offline { background: #ef4444; }
        .api-status .dot.loading { background: #f59e0b; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .traits {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 4px 0;
        }
        .trait-tag {
            background: rgba(108, 99, 255, 0.12);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: var(--accent);
            border: 1px solid rgba(108, 99, 255, 0.15);
        }
        .generating-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .generating-indicator i { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-mask"></i></div>
            <div>
                <h1>Dream Multi-AI</h1>
                <span>Character Generator &amp; Chat</span>
            </div>
        </div>
        <div class="header-actions">
            <span class="badge"><i class="fas fa-bolt"></i> Groq + HF</span>
            <button class="btn btn-primary btn-sm" id="newCharBtn"><i class="fas fa-plus"></i> New Character</button>
        </div>
    </header>
    <div class="main-grid">
        <aside class="sidebar">
            <div class="sidebar-title">
                <span><i class="fas fa-users"></i> Your Characters</span>
                <span id="charCount" style="font-size:12px;color:var(--text-muted);">0</span>
            </div>
            <div class="character-list" id="characterList">
                <div class="empty-state" style="padding:20px;font-size:13px;">
                    <i class="fas fa-plus-circle" style="font-size:32px;"></i>
                    <span>Create your first character</span>
                </div>
            </div>
        </aside>
        <section class="chat-area">
            <div class="chat-header">
                <div class="left">
                    <div class="avatar" id="chatAvatar"><i class="fas fa-user"></i></div>
                    <div>
                        <div class="char-name" id="chatCharName">Select a Character</div>
                        <div class="char-status" id="chatCharStatus">Choose or create a character to start chatting</div>
                    </div>
                </div>
                <div class="api-status">
                    <span class="dot online" id="apiDot"></span>
                    <span id="apiLabel">Groq</span>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <i class="fas fa-comment-dots"></i>
                    <span>Select a character and start chatting</span>
                    <span style="font-size:12px;opacity:0.5;">Messages will appear here</span>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type a message..." disabled />
                <button class="btn btn-primary" id="sendBtn" disabled><i class="fas fa-paper-plane"></i> Send</button>
            </div>
        </section>
    </div>
</div>

<div class="modal-overlay" id="charModal">
    <div class="modal">
        <h2 id="modalTitle">Create Character</h2>
        <input type="hidden" id="editCharId" />
        <label>Character Name *</label>
        <input type="text" id="charName" placeholder="e.g. Captain Zara" />
        <div class="avatar-preview">
            <div class="preview" id="avatarPreview"><i class="fas fa-user"></i></div>
            <button class="btn btn-primary gen-btn" id="genAvatarBtn"><i class="fas fa-wand-magic-sparkles"></i> Generate Portrait</button>
        </div>
        <label>Personality</label>
        <textarea id="charPersonality" placeholder="e.g. Brave, witty, fiercely loyal to her crew..."></textarea>
        <label>Backstory</label>
        <textarea id="charBackstory" placeholder="e.g. A former space marine who now captains a freelancer ship..."></textarea>
        <label>Appearance</label>
        <textarea id="charAppearance" placeholder="e.g. Tall, silver hair, cybernetic eye, scar on left cheek..."></textarea>
        <label>Traits (comma separated)</label>
        <input type="text" id="charTraits" placeholder="e.g. Brave, Loyal, Cunning" />
        <label>System Prompt (advanced)</label>
        <textarea id="charSystemPrompt" placeholder="Custom instructions for the AI..."></textarea>
        <div class="actions">
            <button class="btn" id="modalCancel">Cancel</button>
            <button class="btn btn-primary" id="modalSave">Save Character</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
    groq: {
        url: 'https://api.groq.com/openai/v1/chat/completions',
        key: 'gsk_your_free_key_here',
        models: { llama3: 'llama-3.1-70b-versatile', mixtral: 'mixtral-8x7b-32768', gemma: 'gemma2-9b-it' }
    },
    hf: {
        url: 'https://api-inference.huggingface.co/models/',
        key: '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',
        models: {
            text: 'meta-llama/Meta-Llama-3-8B-Instruct',
            image: 'stabilityai/stable-diffusion-3.5-large'
        }
    }
};
const DEFAULT_SYSTEM = `You are a character in a story. Respond in character, staying true to your personality, backstory, and appearance. Keep responses natural and conversational. Never break character.`;

// ============================================================
// STATE
// ============================================================
let characters = [];
let currentCharId = null;
let chatHistory = {};
let isGenerating = false;
let isGeneratingImage = false;
let tempAvatar = null;

// ============================================================
// DOM REFS
// ============================================================
const $ = id => document.getElementById(id);
const charList = $('characterList');
const chatMessages = $('chatMessages');
const chatInput = $('chatInput');
const sendBtn = $('sendBtn');
const chatCharName = $('chatCharName');
const chatCharStatus = $('chatCharStatus');
const chatAvatar = $('chatAvatar');
const charCount = $('charCount');
const modal = $('charModal');
const modalTitle = $('modalTitle');
const editCharId = $('editCharId');
const charName = $('charName');
const charPersonality = $('charPersonality');
const charBackstory = $('charBackstory');
const charAppearance = $('charAppearance');
const charTraits = $('charTraits');
const charSystemPrompt = $('charSystemPrompt');
const avatarPreview = $('avatarPreview');
const genAvatarBtn = $('genAvatarBtn');
const toast = $('toast');
const toastMsg = $('toastMsg');
const apiDot = $('apiDot');
const apiLabel = $('apiLabel');
let toastTimer = null;

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = 'info') {
    toastMsg.textContent = msg;
    toast.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
}

// ============================================================
// STORAGE
// ============================================================
function saveData() {
    try {
        localStorage.setItem('dream_characters', JSON.stringify(characters));
        localStorage.setItem('dream_chat_history', JSON.stringify(chatHistory));
    } catch (e) {}
}
function loadData() {
    try {
        const c = localStorage.getItem('dream_characters');
        if (c) characters = JSON.parse(c);
        const h = localStorage.getItem('dream_chat_history');
        if (h) chatHistory = JSON.parse(h);
    } catch (e) {}
}

// ============================================================
// CHARACTER CRUD
// ============================================================
function createCharacter(data) {
    const id = Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
    const char = {
        id,
        name: data.name.trim(),
        personality: data.personality.trim(),
        backstory: data.backstory.trim(),
        appearance: data.appearance.trim(),
        traits: data.traits ? data.traits.split(',').map(s => s.trim()).filter(Boolean) : [],
        systemPrompt: data.systemPrompt.trim() || DEFAULT_SYSTEM,
        avatar: data.avatar || null,
        created: Date.now()
    };
    characters.push(char);
    chatHistory[id] = [];
    saveData();
    renderCharacters();
    selectCharacter(id);
    showToast(`✨ Character "${char.name}" created!`, 'success');
    return char;
}

function updateCharacter(id, data) {
    const idx = characters.findIndex(c => c.id === id);
    if (idx === -1) return;
    const char = characters[idx];
    Object.assign(char, {
        name: data.name.trim(),
        personality: data.personality.trim(),
        backstory: data.backstory.trim(),
        appearance: data.appearance.trim(),
        traits: data.traits ? data.traits.split(',').map(s => s.trim()).filter(Boolean) : [],
        systemPrompt: data.systemPrompt.trim() || DEFAULT_SYSTEM,
    });
    if (data.avatar) char.avatar = data.avatar;
    saveData();
    renderCharacters();
    if (currentCharId === id) renderChatHeader(char);
    showToast(`✅ Character "${char.name}" updated`, 'success');
}

function deleteCharacter(id) {
    if (!confirm('Delete this character?')) return;
    const char = characters.find(c => c.id === id);
    characters = characters.filter(c => c.id !== id);
    delete chatHistory[id];
    saveData();
    renderCharacters();
    if (currentCharId === id) {
        currentCharId = characters.length > 0 ? characters[0].id : null;
        if (currentCharId) selectCharacter(currentCharId);
        else renderEmptyChat();
    }
    showToast(`🗑️ Deleted "${char.name}"`, 'info');
}

function getCharacter(id) { return characters.find(c => c.id === id); }
function getChat(id) { return chatHistory[id] || []; }

// ============================================================
// AVATAR
// ============================================================
function getAvatarHtml(char) {
    if (char.avatar) return `<img src="${char.avatar}" alt="${char.name}" />`;
    return `<i class="fas fa-user"></i>`;
}

async function generateAvatar(prompt) {
    if (isGeneratingImage) return;
    isGeneratingImage = true;
    genAvatarBtn.disabled = true;
    genAvatarBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
    avatarPreview.innerHTML = '<i class="fas fa-circle-notch fa-spin" style="font-size:24px;color:var(--accent);"></i>';
    try {
        const imgUrl = await callImageAPI(prompt);
        tempAvatar = imgUrl;
        avatarPreview.innerHTML = `<img src="${imgUrl}" alt="Generated avatar" />`;
        showToast('✨ Portrait generated!', 'success');
    } catch (e) {
        avatarPreview.innerHTML = '<i class="fas fa-user"></i>';
        showToast('Error generating portrait: ' + e.message, 'error');
    }
    isGeneratingImage = false;
    genAvatarBtn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Generate Portrait';
    genAvatarBtn.disabled = false;
}

async function callImageAPI(prompt) {
    const model = CONFIG.hf.models.image;
    const url = CONFIG.hf.url + model;
    const headers = { 'Content-Type': 'application/json' };
    if (CONFIG.hf.key) headers['Authorization'] = `Bearer ${CONFIG.hf.key}`;
    const resp = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify({
            inputs: prompt,
            parameters: {
                negative_prompt: 'blurry, bad quality, distorted, ugly, deformed',
                num_inference_steps: 25,
                guidance_scale: 7.5,
                width: 512,
                height: 512
            }
        })
    });
    if (!resp.ok) {
        const err = await resp.text();
        throw new Error(`Image API error: ${resp.status} - ${err}`);
    }
    const blob = await resp.blob();
    return URL.createObjectURL(blob);
}

// ============================================================
// RENDER
// ============================================================
function renderCharacters() {
    if (characters.length === 0) {
        charList.innerHTML = `<div class="empty-state" style="padding:20px;font-size:13px;">
            <i class="fas fa-plus-circle" style="font-size:32px;"></i>
            <span>Create your first character</span>
        </div>`;
        charCount.textContent = '0';
        return;
    }
    charCount.textContent = characters.length;
    charList.innerHTML = characters.map(c => `
        <div class="character-item ${currentCharId === c.id ? 'active' : ''}" data-id="${c.id}">
            <div class="avatar">${getAvatarHtml(c)}</div>
            <div class="info">
                <div class="name">${c.name}</div>
                <div class="sub">${c.traits.slice(0, 2).join(', ') || 'No traits'}</div>
            </div>
            <div class="actions">
                <button onclick="editCharacter('${c.id}')" title="Edit"><i class="fas fa-pen"></i></button>
                <button onclick="deleteCharacter('${c.id}')" title="Delete"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    `).join('');
    charList.querySelectorAll('.character-item').forEach(el => {
        el.addEventListener('click', (e) => {
            if (e.target.closest('.actions')) return;
            selectCharacter(el.dataset.id);
        });
    });
}

function selectCharacter(id) {
    currentCharId = id;
    const char = getCharacter(id);
    if (!char) return;
    renderCharacters();
    renderChatHeader(char);
    renderChatMessages(id);
    chatInput.disabled = false;
    sendBtn.disabled = false;
    chatInput.focus();
}

function renderChatHeader(char) {
    chatAvatar.innerHTML = getAvatarHtml(char);
    chatCharName.textContent = char.name;
    const traitStr = char.traits.length ? `🧩 ${char.traits.join(' · ')}` : '';
    chatCharStatus.textContent = traitStr || `${char.personality.slice(0, 60)}${char.personality.length > 60 ? '...' : ''}`;
}

function renderChatMessages(id) {
    const msgs = getChat(id);
    if (msgs.length === 0) {
        const char = getCharacter(id);
        chatMessages.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-comment-dots"></i>
                <span>Start chatting with ${char ? char.name : 'this character'}</span>
                <span style="font-size:12px;opacity:0.5;">Say hello and see how they respond</span>
            </div>
        `;
        return;
    }
    chatMessages.innerHTML = msgs.map(m => `
        <div class="message ${m.role}">
            <div class="sender">${m.role === 'user' ? 'You' : (getCharacter(id)?.name || 'AI')}</div>
            <div class="content">${m.content}</div>
        </div>
    `).join('');
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function renderEmptyChat() {
    chatCharName.textContent = 'Select a Character';
    chatCharStatus.textContent = 'Choose or create a character to start chatting';
    chatAvatar.innerHTML = '<i class="fas fa-user"></i>';
    chatMessages.innerHTML = `
        <div class="empty-state">
            <i class="fas fa-comment-dots"></i>
            <span>Select a character and start chatting</span>
        </div>
    `;
    chatInput.disabled = true;
    sendBtn.disabled = true;
}

// ============================================================
// MODAL
// ============================================================
function openModal(char = null) {
    tempAvatar = null;
    if (char) {
        modalTitle.textContent = 'Edit Character';
        editCharId.value = char.id;
        charName.value = char.name;
        charPersonality.value = char.personality;
        charBackstory.value = char.backstory;
        charAppearance.value = char.appearance;
        charTraits.value = char.traits.join(', ');
        charSystemPrompt.value = char.systemPrompt || DEFAULT_SYSTEM;
        if (char.avatar) {
            avatarPreview.innerHTML = `<img src="${char.avatar}" alt="Avatar" />`;
            tempAvatar = char.avatar;
        } else {
            avatarPreview.innerHTML = '<i class="fas fa-user"></i>';
        }
    } else {
        modalTitle.textContent = 'Create Character';
        editCharId.value = '';
        charName.value = '';
        charPersonality.value = '';
        charBackstory.value = '';
        charAppearance.value = '';
        charTraits.value = '';
        charSystemPrompt.value = DEFAULT_SYSTEM;
        avatarPreview.innerHTML = '<i class="fas fa-user"></i>';
    }
    modal.classList.add('active');
    setTimeout(() => charName.focus(), 100);
}

function closeModal() { modal.classList.remove('active'); }

function saveModal() {
    const data = {
        name: charName.value,
        personality: charPersonality.value,
        backstory: charBackstory.value,
        appearance: charAppearance.value,
        traits: charTraits.value,
        systemPrompt: charSystemPrompt.value,
        avatar: tempAvatar,
    };
    if (!data.name) { showToast('Please enter a name', 'error'); return; }
    const id = editCharId.value;
    if (id) updateCharacter(id, data);
    else createCharacter(data);
    closeModal();
}

window.editCharacter = function(id) {
    const char = getCharacter(id);
    if (char) openModal(char);
};

// ============================================================
// CHAT
// ============================================================
function addMessage(id, role, content) {
    if (!chatHistory[id]) chatHistory[id] = [];
    chatHistory[id].push({ role, content, timestamp: Date.now() });
    saveData();
    if (currentCharId === id) renderChatMessages(id);
}

async function sendMessage() {
    if (isGenerating) return;
    const text = chatInput.value.trim();
    if (!text) return;
    if (!currentCharId) { showToast('Select a character first', 'warning'); return; }
    const char = getCharacter(currentCharId);
    if (!char) { showToast('Character not found', 'error'); return; }
    chatInput.value = '';
    addMessage(currentCharId, 'user', text);
    isGenerating = true;
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    const history = getChat(currentCharId);
    const msgs = history.slice(-10).map(m => ({
        role: m.role === 'user' ? 'user' : 'assistant',
        content: m.content
    }));
    const systemPrompt = buildSystemPrompt(char);
    try {
        const response = await callAI(systemPrompt, msgs, text);
        addMessage(currentCharId, 'ai', response);
    } catch (e) {
        showToast('Error: ' + e.message, 'error');
        addMessage(currentCharId, 'ai', '*Error generating response. Please try again.*');
    }
    isGenerating = false;
    sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
    sendBtn.disabled = false;
    chatInput.focus();
}

function buildSystemPrompt(char) {
    let parts = [char.systemPrompt || DEFAULT_SYSTEM];
    if (char.personality) parts.push(`Personality: ${char.personality}`);
    if (char.backstory) parts.push(`Backstory: ${char.backstory}`);
    if (char.appearance) parts.push(`Appearance: ${char.appearance}`);
    if (char.traits.length) parts.push(`Traits: ${char.traits.join(', ')}`);
    parts.push(`Your name is ${char.name}. Respond as this character.`);
    return parts.join('\n');
}

// ============================================================
// AI API
// ============================================================
async function callAI(systemPrompt, history, userMsg) {
    const messages = [{ role: 'system', content: systemPrompt }, ...history, { role: 'user', content: userMsg }];
    if (CONFIG.groq.key && CONFIG.groq.key !== 'gsk_your_free_key_here') {
        try {
            return await callGroq(messages);
        } catch (e) {
            console.warn('Groq failed, falling back to HF:', e);
            return await callHuggingFace(messages);
        }
    }
    return await callHuggingFace(messages);
}

async function callGroq(messages) {
    const resp = await fetch(CONFIG.groq.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CONFIG.groq.key}` },
        body: JSON.stringify({
            model: CONFIG.groq.models.llama3,
            messages,
            temperature: 0.8,
            max_tokens: 512,
        })
    });
    if (!resp.ok) throw new Error(`Groq API error: ${resp.status}`);
    const data = await resp.json();
    return data.choices[0].message.content;
}

async function callHuggingFace(messages) {
    const model = CONFIG.hf.models.text;
    const url = CONFIG.hf.url + model;
    const headers = { 'Content-Type': 'application/json' };
    if (CONFIG.hf.key) headers['Authorization'] = `Bearer ${CONFIG.hf.key}`;
    const prompt = messages.map(m => `${m.role.toUpperCase()}: ${m.content}`).join('\n') + '\nASSISTANT:';
    const resp = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify({ inputs: prompt, parameters: { max_new_tokens: 512, temperature: 0.8, do_sample: true } })
    });
    if (!resp.ok) throw new Error(`HF API error: ${resp.status}`);
    const data = await resp.json();
    return data.generated_text || data[0]?.generated_text || 'No response';
}

// ============================================================
// EVENT BINDINGS
// ============================================================
$('newCharBtn').addEventListener('click', () => openModal());
$('modalCancel').addEventListener('click', closeModal);
$('modalSave').addEventListener('click', saveModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
$('sendBtn').addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

genAvatarBtn.addEventListener('click', () => {
    const name = charName.value.trim() || 'Character';
    const personality = charPersonality.value.trim() || 'a mysterious figure';
    const appearance = charAppearance.value.trim() || '';
    let prompt = `Portrait of ${name}, ${personality}`;
    if (appearance) prompt += `, ${appearance}`;
    prompt += ', character design, digital art, fantasy, detailed, beautiful, professional portrait';
    generateAvatar(prompt);
});

// ============================================================
// INIT
// ============================================================
loadData();
renderCharacters();
if (characters.length > 0) {
    selectCharacter(characters[0].id);
} else {
    renderEmptyChat();
}
if (!CONFIG.groq.key || CONFIG.groq.key === 'gsk_your_free_key_here') {
    apiDot.className = 'dot offline';
    apiLabel.textContent = 'HF (limited)';
    showToast('💡 Get a free Groq key at console.groq.com for faster responses', 'info');
}
console.log('🎭 Dream Multi-AI Character Generator loaded!');
console.log('📚 Characters:', characters.length);
</script>
