<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Multi-AI Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --bg-input: #0f0f1a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b8;
            --accent: #6c63ff;
            --accent-hover: #7b72ff;
            --accent-glow: rgba(108, 99, 255, 0.3);
            --border-color: #2a2a4a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        .container {
            max-width: 900px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 32px;
            color: var(--accent);
            background: rgba(108, 99, 255, 0.15);
            padding: 10px;
            border-radius: 12px;
        }
        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c63ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span {
            font-size: 14px;
            color: var(--text-secondary);
            -webkit-text-fill-color: var(--text-secondary);
        }
        .badge {
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(108, 99, 255, 0.12);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent);
            border: 1px solid rgba(108, 99, 255, 0.2);
        }
        .badge i { font-size: 14px; }
        .model-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .model-btn {
            padding: 8px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .model-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .model-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .model-btn .model-status { font-size: 10px; opacity: 0.7; }
        .input-area { margin-bottom: 20px; }
        .input-area textarea {
            width: 100%;
            min-height: 120px;
            padding: 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            resize: vertical;
            font-family: inherit;
            transition: var(--transition);
            line-height: 1.6;
        }
        .input-area textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .input-area textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }
        .controls .settings-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
        }
        .controls label {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .controls input[type="number"],
        .controls select {
            padding: 6px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            width: 70px;
        }
        .controls select { width: auto; min-width: 100px; }
        .controls input[type="range"] {
            width: 100px;
            accent-color: var(--accent);
            background: transparent;
        }
        .generate-btn {
            padding: 12px 32px;
            background: linear-gradient(135deg, #6c63ff, #a855f7);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.3);
            margin-left: auto;
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.4);
        }
        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .generate-btn .spinner { display: none; animation: spin 1s linear infinite; }
        .generate-btn.loading .spinner { display: inline-block; }
        .generate-btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .output-area {
            background: var(--bg-input);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            min-height: 200px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            transition: var(--transition);
        }
        .output-area:has(.output-content:not(:empty)) { border-color: var(--accent); }
        .output-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.8;
            font-size: 15px;
            color: var(--text-primary);
        }
        .output-content .placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
            font-style: italic;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            gap: 12px;
        }
        .output-content .placeholder i { font-size: 48px; opacity: 0.3; }
        .output-content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid var(--border-color);
        }
        .output-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .output-actions button {
            padding: 6px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .output-actions button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
        }
        .footer .links {
            display: flex;
            gap: 16px;
        }
        .footer .links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .footer .links a:hover { color: var(--accent); }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            font-size: 14px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: #ef4444; }
        .toast.success { border-color: #22c55e; }
        @media (max-width: 640px) {
            .container { padding: 16px; }
            .header { flex-direction: column; align-items: flex-start; }
            .controls { flex-direction: column; align-items: stretch; }
            .generate-btn { margin-left: 0; justify-content: center; }
            .model-selector { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
            .footer { flex-direction: column; text-align: center; }
            .controls .settings-group { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-wand-magic-sparkles"></i></div>
                <div>
                    <h1>Dream Multi-AI</h1>
                    <span>Free • No API Key Required</span>
                </div>
            </div>
            <div class="badge">
                <i class="fas fa-bolt"></i>
                <span>Powered by Groq &amp; Hugging Face</span>
            </div>
        </header>

        <div class="model-selector" id="modelSelector">
            <button class="model-btn active" data-model="llama3">
                <i class="fas fa-brain"></i> Llama 3 <span class="model-status">(fast)</span>
            </button>
            <button class="model-btn" data-model="mixtral">
                <i class="fas fa-robot"></i> Mixtral <span class="model-status">(creative)</span>
            </button>
            <button class="model-btn" data-model="gemma">
                <i class="fas fa-gem"></i> Gemma <span class="model-status">(balanced)</span>
            </button>
            <button class="model-btn" data-model="sd-image">
                <i class="fas fa-image"></i> Stable Diffusion <span class="model-status">(image)</span>
            </button>
        </div>

        <div class="input-area">
            <textarea id="promptInput" placeholder="Describe what you want to create...&#10;Example: 'A futuristic city with neon lights and flying cars, cyberpunk style'">A serene landscape with mountains, a lake reflecting the sunset, and a cabin with smoke rising from the chimney</textarea>
        </div>

        <div class="controls">
            <div class="settings-group">
                <label>
                    <i class="fas fa-thermometer-half"></i> Temperature
                    <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.8" />
                    <span id="tempDisplay">0.8</span>
                </label>
                <label>
                    <i class="fas fa-list-ol"></i> Max Tokens
                    <input type="number" id="maxTokens" value="512" min="64" max="2048" step="64" />
                </label>
            </div>
            <button class="generate-btn" id="generateBtn">
                <span class="btn-text"><i class="fas fa-play"></i> Generate</span>
                <span class="spinner"><i class="fas fa-circle-notch"></i></span>
            </button>
        </div>

        <div class="output-area">
            <div class="output-content" id="outputContent">
                <div class="placeholder">
                    <i class="fas fa-robot"></i>
                    <span>Your creation will appear here...</span>
                    <span style="font-size:12px;opacity:0.5;">Choose a model, enter a prompt, and click Generate</span>
                </div>
            </div>
        </div>

        <div class="output-actions">
            <button id="copyBtn"><i class="fas fa-copy"></i> Copy</button>
            <button id="downloadBtn"><i class="fas fa-download"></i> Download</button>
            <button id="clearBtn"><i class="fas fa-trash"></i> Clear</button>
        </div>

        <footer class="footer">
            <span>© 2026 Dream Multi-AI &mdash; Free &amp; Open</span>
            <div class="links">
                <a href="#" id="donateLink"><i class="fas fa-heart" style="color:#ef4444;"></i> Support</a>
                <a href="https://github.com/alsania-dev/dream-multiai" target="_blank"><i class="fab fa-github"></i> GitHub</a>
                <a href="#" id="feedbackLink"><i class="fas fa-comment"></i> Feedback</a>
            </div>
        </footer>
    </div>

    <div class="toast" id="toast">
        <span id="toastIcon"><i class="fas fa-info-circle"></i></span>
        <span id="toastMessage">Ready</span>
    </div>

    <script>
        const CONFIG = {
            groq: {
                url: 'https://api.groq.com/openai/v1/chat/completions',
                key: 'gsk_your_free_key_here',
                models: {
                    llama3: 'llama-3.1-70b-versatile',
                    mixtral: 'mixtral-8x7b-32768',
                    gemma: 'gemma2-9b-it'
                }
            },
            huggingface: {
                url: 'https://api-inference.huggingface.co/models/',
                key: '',
                models: {
                    'sd-image': 'stabilityai/stable-diffusion-3.5-large',
                    'llama3': 'meta-llama/Meta-Llama-3-8B-Instruct',
                    'mixtral': 'mistralai/Mixtral-8x7B-Instruct-v0.1'
                }
            }
        };

        const state = { selectedModel: 'llama3', isGenerating: false, outputText: '', isImageMode: false };

        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const promptInput = $('#promptInput');
        const generateBtn = $('#generateBtn');
        const outputContent = $('#outputContent');
        const temperature = $('#temperature');
        const tempDisplay = $('#tempDisplay');
        const maxTokens = $('#maxTokens');
        const modelBtns = $$('.model-btn');
        const toast = $('#toast');
        const toastMessage = $('#toastMessage');
        const toastIcon = $('#toastIcon');

        let toastTimeout = null;

        function showToast(message, type = 'info') {
            const iconMap = { info: 'fa-info-circle', success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-triangle-exclamation' };
            toastIcon.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i>`;
            toastMessage.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        modelBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modelBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.selectedModel = btn.dataset.model;
                state.isImageMode = state.selectedModel === 'sd-image';
                if (state.isImageMode) {
                    promptInput.placeholder = 'Describe the image you want to generate...\nExample: "A cyberpunk city with neon lights, raining, dramatic lighting"';
                } else {
                    promptInput.placeholder = 'Describe what you want to create...\nExample: "Write a short story about a robot learning to paint"';
                }
                showToast(`Switched to ${btn.textContent.trim()}`, 'info');
            });
        });

        temperature.addEventListener('input', () => {
            tempDisplay.textContent = parseFloat(temperature.value).toFixed(1);
        });

        async function callGroq(model, prompt, temp, tokens) {
            const modelMap = CONFIG.groq.models;
            const modelName = modelMap[model] || modelMap.llama3;
            const response = await fetch(CONFIG.groq.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CONFIG.groq.key}` },
                body: JSON.stringify({
                    model: modelName,
                    messages: [
                        { role: 'system', content: 'You are a creative AI assistant. Provide detailed, thoughtful, and well-structured responses.' },
                        { role: 'user', content: prompt }
                    ],
                    temperature: parseFloat(temp),
                    max_tokens: parseInt(tokens),
                })
            });
            if (!response.ok) {
                const error = await response.text();
                throw new Error(`Groq API error: ${response.status} - ${error}`);
            }
            const data = await response.json();
            return data.choices[0].message.content;
        }

        async function callHuggingFace(model, prompt, isImage = false) {
            const modelMap = CONFIG.huggingface.models;
            const modelName = modelMap[model] || modelMap.llama3;
            const url = CONFIG.huggingface.url + modelName;
            const headers = { 'Content-Type': 'application/json' };
            if (CONFIG.huggingface.key) headers['Authorization'] = `Bearer ${CONFIG.huggingface.key}`;

            if (isImage) {
                const response = await fetch(url, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        inputs: prompt,
                        parameters: { negative_prompt: 'blurry, bad quality, distorted', num_inference_steps: 28, guidance_scale: 7.5 }
                    })
                });
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(`Hugging Face Image API error: ${response.status} - ${error}`);
                }
                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);
                return `<img src="${imageUrl}" alt="Generated image" />`;
            } else {
                const response = await fetch(url, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        inputs: prompt,
                        parameters: { max_new_tokens: 512, temperature: 0.8, do_sample: true }
                    })
                });
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(`Hugging Face Text API error: ${response.status} - ${error}`);
                }
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    return data[0].generated_text || data[0].content || JSON.stringify(data);
                }
                return data.generated_text || JSON.stringify(data);
            }
        }

        async function generate() {
            if (state.isGenerating) return;
            const prompt = promptInput.value.trim();
            if (!prompt) { showToast('Please enter a prompt first', 'warning'); return; }

            state.isGenerating = true;
            generateBtn.classList.add('loading');
            generateBtn.disabled = true;

            const temp = temperature.value;
            const tokens = maxTokens.value;

            outputContent.innerHTML = `
                <div class="placeholder" style="min-height:160px;">
                    <i class="fas fa-circle-notch fa-spin" style="font-size:32px;color:var(--accent);"></i>
                    <span>Generating... this may take a few seconds</span>
                    <span style="font-size:12px;opacity:0.5;">Using ${state.selectedModel} ${state.isImageMode ? '(image)' : '(text)'}</span>
                </div>
            `;

            try {
                let result;
                if (state.isImageMode) {
                    result = await callHuggingFace('sd-image', prompt, true);
                } else {
                    if (CONFIG.groq.key && CONFIG.groq.key !== 'gsk_your_free_key_here') {
                        try {
                            result = await callGroq(state.selectedModel, prompt, temp, tokens);
                        } catch (e) {
                            console.warn('Groq failed, falling back to Hugging Face:', e);
                            result = await callHuggingFace(state.selectedModel, prompt, false);
                        }
                    } else {
                        result = await callHuggingFace(state.selectedModel, prompt, false);
                    }
                }

                outputContent.innerHTML = result;
                state.outputText = result;
                if (!state.isImageMode) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = result;
                    state.outputText = tempDiv.textContent || result;
                } else {
                    state.outputText = result;
                }
                showToast('✨ Generation complete!', 'success');
            } catch (error) {
                console.error('Generation error:', error);
                outputContent.innerHTML = `
                    <div class="placeholder" style="min-height:160px;color:#ef4444;">
                        <i class="fas fa-exclamation-triangle" style="font-size:32px;"></i>
                        <span>Error generating content</span>
                        <span style="font-size:13px;opacity:0.7;">${error.message || 'Unknown error'}</span>
                        <span style="font-size:12px;opacity:0.5;margin-top:8px;">Try again or switch models</span>
                    </div>
                `;
                showToast(`Error: ${error.message || 'Unknown error'}`, 'error');
            }

            state.isGenerating = false;
            generateBtn.classList.remove('loading');
            generateBtn.disabled = false;
        }

        $('#copyBtn').addEventListener('click', () => {
            const text = state.outputText;
            if (!text || text.includes('placeholder')) { showToast('Nothing to copy yet', 'warning'); return; }
            if (state.isImageMode) {
                const img = outputContent.querySelector('img');
                if (img) {
                    navigator.clipboard.writeText(img.src).then(() => showToast('Image URL copied!', 'success'))
                        .catch(() => showToast('Failed to copy', 'error'));
                }
                return;
            }
            navigator.clipboard.writeText(state.outputText).then(() => showToast('Copied to clipboard!', 'success'))
                .catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = state.outputText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('Copied!', 'success');
                });
        });

        $('#downloadBtn').addEventListener('click', () => {
            const text = state.outputText;
            if (!text || text.includes('placeholder')) { showToast('Nothing to download yet', 'warning'); return; }
            if (state.isImageMode) {
                const img = outputContent.querySelector('img');
                if (img) {
                    const link = document.createElement('a');
                    link.href = img.src;
                    link.download = `dream-ai-${Date.now()}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast('Image downloaded!', 'success');
                }
                return;
            }
            const blob = new Blob([state.outputText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `dream-ai-${Date.now()}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('Downloaded!', 'success');
        });

        $('#clearBtn').addEventListener('click', () => {
            outputContent.innerHTML = `
                <div class="placeholder">
                    <i class="fas fa-robot"></i>
                    <span>Your creation will appear here...</span>
                    <span style="font-size:12px;opacity:0.5;">Cleared</span>
                </div>
            `;
            state.outputText = '';
            showToast('Cleared', 'info');
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); generate(); }
        });

        generateBtn.addEventListener('click', generate);

        if (!CONFIG.groq.key || CONFIG.groq.key === 'gsk_your_free_key_here') {
            console.info('💡 Get a free Groq API key at https://console.groq.com');
            showToast('Using Hugging Face (free, rate-limited). Get a Groq key for faster generation.', 'info');
        }

        showToast('Ready! Choose a model and enter a prompt.', 'info');
        console.log('🚀 Dream Multi-AI loaded successfully!');
    </script>
</body>
</html>
